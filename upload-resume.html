<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Envio de Currículo - Rezynt</title>
    <style>
        /* CSS Variables for consistent theming */
        :root {
            --primary-color: #8e6e53;
            --secondary-color: #c69c72;
            --background-hover: #f4ede7;
            --text-primary: #000;
            --text-secondary: #333;
            --success-color: #28a745;
            --border-radius: 10px;
            --transition-duration: 0.2s;
        }

        /* Reset and base styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: var(--text-primary); }

        /* Main container */
        .resume-upload-section { margin-bottom: 40px; padding: 20px; }
        .resume-steps { display: flex; justify-content: center; max-width: 1200px; margin: 0 auto; }

        .resume-steps__container { display: grid; grid-template-columns: 1fr auto 2fr auto 1fr; align-items: center; width: 100%; gap: 20px; max-width: 1200px; margin: 0 auto; }

        /* Step components */
        .step { text-align: center; }
        .step--upload { grid-column: 3; }
        .step--side { grid-column: 1; }
        .step--side:last-of-type { grid-column: 5; }

        .step-text { font-size: 18px; color: var(--text-primary); line-height: 1.4; font-weight: 500; }

        /* Arrow component */
        .arrow { display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .arrow__icon { width: 80px; height: auto; fill: var(--primary-color); }

        /* Upload area */
        .upload-area { border: 2px dashed var(--secondary-color); padding: 24px 20px; border-radius: var(--border-radius); cursor: pointer; transition: all var(--transition-duration) ease; display: flex; flex-direction: column; align-items: center; max-width: 400px; width: 100%; margin: 0 auto; background: transparent; position: relative; }
        .upload-area:hover { border-color: var(--primary-color); background-color: var(--background-hover); }
        .upload-area:focus-within { outline: 2px solid var(--primary-color); outline-offset: 2px; }
        .upload-area--dragover { border-color: var(--primary-color); background-color: var(--background-hover); transform: scale(1.02); }

        .upload-area__input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .upload-area__title { font-size: 18px; color: var(--text-primary); margin-bottom: 8px; font-weight: 600; text-align: center; }
        .upload-area__subtitle { font-size: 15px; color: var(--text-secondary); text-align: center; }
        .upload-area__filename { margin-top: 12px; font-size: 14px; color: var(--success-color); word-break: break-word; text-align: center; font-weight: 500; }
        .upload-area__filename--error { color: #dc3545; }

        /* Loading spinner */
        .upload-area__spinner { display: none; width: 20px; height: 20px; border: 2px solid var(--secondary-color); border-top: 2px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin: 8px auto 0; }
        .upload-area__spinner--visible { display: block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Loading state */
        .upload-area--loading { pointer-events: none; opacity: 0.7; }
        .upload-area--loading .upload-area__title { color: var(--text-secondary); }

        /* Accessibility improvements */
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

        /* MOBILE-ONLY FIXES */
        @media (max-width: 768px) {
            .resume-steps__container { grid-template-columns: 1fr; gap: 16px; justify-items: center; align-items: center; max-width: 560px; }
            .step, .step--side, .step--upload { grid-column: 1 !important; width: 100%; }
            .step-text { font-size: 16px; text-align: center; font-weight: 600; }
            .arrow { display: none; }
            .upload-area { max-width: 100%; width: 100%; padding: 20px 16px; border-radius: 12px; }
            .resume-upload-section { padding: 16px; }
        }
        @media (max-width: 480px) {
            .step-text { font-size: 15px; }
            .upload-area__title { font-size: 16px; }
            .upload-area__subtitle { font-size: 14px; }
            .resume-upload-section { padding: 12px; }
        }
    </style>
</head>
<body>
    <section class="resume-upload-section" aria-labelledby="resume-upload-title">
        <div class="resume-steps">
            <div class="resume-steps__container">
                <!-- Step 1: Question -->
                <div class="step step--side">
                    <p class="step-text" id="resume-upload-title">Já tem um currículo?</p>
                </div>

                <!-- Arrow -->
                <div class="arrow" aria-hidden="true">

                        <path d="m 158.23742,166.89056 c 0.068,-0.29 0.44081,-1.13427 0.68432,-1.54963 0.55907,-0.95363 1.18087,-1.66565 2.09299,-2.39671 3.05776,-2.45077 6.04892,-4.04449 9.36336,-4.98889 4.17843,-1.19057 8.38065,-1.0655 12.18533,0.36269 0.89031,0.3342 2.37369,1.07655 3.24263,1.62276 1.12076,0.70451 1.98178,1.37102 3.3175,2.56806 l 0.30876,0.27671 -0.20168,-0.36389 c -0.61035,-1.10125 -1.67463,-2.72931 -3.17869,-4.86255 -0.78707,-1.11631 -1.25749,-1.79003 -2.01543,-2.88642 l -0.10786,-0.15602 0.18074,0.14922 c 0.93689,0.77352 3.47117,3.25914 4.39084,4.30654 0.9952,1.1334 1.96374,2.45976 2.46188,3.37138 0.4464,0.81694 0.6775,1.83914 0.60848,2.69139 -0.0191,0.23599 -0.041,0.42907 -0.0487,0.42907 -0.008,0 -0.16539,-0.0789 -0.35048,-0.17541 -0.34907,-0.18195 -2.84625,-1.01532 -4.22138,-1.40878 -1.45574,-0.41652 -3.07522,-0.74894 -4.42818,-0.90896 -0.91988,-0.10879 -1.99985,-0.15827 -3.53652,-0.16202 -1.06329,-0.003 -1.52003,-0.0199 -1.43403,-0.0542 0.3698,-0.14778 2.31797,-0.58582 3.20229,-0.72003 1.05975,-0.16082 2.4774,-0.20357 3.53652,-0.10664 1.34643,0.12323 2.91481,0.43193 3.81609,0.75109 0.39136,0.13859 0.36042,0.0887 -0.14947,-0.24091 -2.96782,-1.91867 -6.05902,-3.05043 -9.43947,-3.45601 -0.81687,-0.098 -2.50741,-0.10885 -3.38049,-0.0217 -3.79035,0.37841 -7.75177,1.96543 -11.15563,4.46916 -0.21453,0.1578 -0.80326,0.60933 -1.30829,1.0034 -0.50503,0.39406 -1.13692,0.85838 -1.4042,1.03182 -0.55471,0.35995 -1.64645,0.92495 -2.41025,1.24738 -0.28605,0.12074 -0.55081,0.24444 -0.58836,0.27488 -0.0546,0.0443 -0.0611,0.0249 -0.0326,-0.0968 z" transform="translate(-158.22,-154.52)" />
                    </svg>
                </div>

                <!-- Step 2: Upload -->
                <div class="step step--upload">
                    <label class="upload-area" id="resume-drop-area" for="resume-upload" tabindex="0" role="button" aria-describedby="resume-upload-hint">
                        <span class="upload-area__title">Solte aqui — nós fazemos o trabalho pesado</span>
                        <span class="upload-area__subtitle" id="resume-upload-hint">Clique ou solte seu currículo para começar</span>
                        <input type="file" id="resume-upload" class="upload-area__input" accept=".txt,.md,.doc,.docx,.pdf" aria-describedby="resume-upload-hint" />
                        <div class="upload-area__filename" id="resume-file-name" aria-live="polite"></div>
                        <div class="upload-area__spinner" id="upload-spinner" aria-hidden="true"></div>
                    </label>
                </div>

                <!-- Arrow -->
                <div class="arrow" aria-hidden="true">
                    <svg class="arrow__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33.36 12.49">
                        <path d="m 158.23742,166.89056 c 0.068,-0.29 0.44081,-1.13427 0.68432,-1.54963 0.55907,-0.95363 1.18087,-1.66565 2.09299,-2.39671 3.05776,-2.45077 6.04892,-4.04449 9.36336,-4.98889 4.17843,-1.19057 8.38065,-1.0655 12.18533,0.36269 0.89031,0.3342 2.37369,1.07655 3.24263,1.62276 1.12076,0.70451 1.98178,1.37102 3.3175,2.56806 l 0.30876,0.27671 -0.20168,-0.36389 c -0.61035,-1.10125 -1.67463,-2.72931 -3.17869,-4.86255 -0.78707,-1.11631 -1.25749,-1.79003 -2.01543,-2.88642 l -0.10786,-0.15602 0.18074,0.14922 c 0.93689,0.77352 3.47117,3.25914 4.39084,4.30654 0.9952,1.1334 1.96374,2.45976 2.46188,3.37138 0.4464,0.81694 0.6775,1.83914 0.60848,2.69139 -0.0191,0.23599 -0.041,0.42907 -0.0487,0.42907 -0.008,0 -0.16539,-0.0789 -0.35048,-0.17541 -0.34907,-0.18195 -2.84625,-1.01532 -4.22138,-1.40878 -1.45574,-0.41652 -3.07522,-0.74894 -4.42818,-0.90896 -0.91988,-0.10879 -1.99985,-0.15827 -3.53652,-0.16202 -1.06329,-0.003 -1.52003,-0.0199 -1.43403,-0.0542 0.3698,-0.14778 2.31797,-0.58582 3.20229,-0.72003 1.05975,-0.16082 2.4774,-0.20357 3.53652,-0.10664 1.34643,0.12323 2.91481,0.43193 3.81609,0.75109 0.39136,0.13859 0.36042,0.0887 -0.14947,-0.24091 -2.96782,-1.91867 -6.05902,-3.05043 -9.43947,-3.45601 -0.81687,-0.098 -2.50741,-0.10885 -3.38049,-0.0217 -3.79035,0.37841 -7.75177,1.96543 -11.15563,4.46916 -0.21453,0.1578 -0.80326,0.60933 -1.30829,1.0034 -0.50503,0.39406 -1.13692,0.85838 -1.4042,1.03182 -0.55471,0.35995 -1.64645,0.92495 -2.41025,1.24738 -0.28605,0.12074 -0.55081,0.24444 -0.58836,0.27488 -0.0546,0.0443 -0.0611,0.0249 -0.0326,-0.0968 z" transform="translate(-158.22,-154.52)" />
                    </svg>
                </div>

                <!-- Step 3: AI Analysis -->
                <div class="step step--side">
                    <p class="step-text">Obtenha uma versão polida e pronta para ATS em minutos</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        (function() {
            'use strict';

            // Configuration
            const CONFIG = {
              uploadUrl: 'https://app.rezynt.com/api/v1/resume/temp-upload',
              redirectBase: 'https://app.rezynt.com/signup?temp_file_id='
            };

            // DOM elements
            const elements = {
                dropArea: document.getElementById('resume-drop-area'),
                fileInput: document.getElementById('resume-upload'),
                fileNameDisplay: document.getElementById('resume-file-name'),
                spinner: document.getElementById('upload-spinner')
            };

            // State management
            let isDragOver = false;
            let isProcessing = false;

            // Utility functions
            const utils = {
                showMessage: (message, isError = false) => {
                    elements.fileNameDisplay.textContent = message;
                    elements.fileNameDisplay.className = `upload-area__filename${isError ? ' upload-area__filename--error' : ''}`;
                },

                updateDragState: (isDragging) => {
                    isDragOver = isDragging;
                    elements.dropArea.classList.toggle('upload-area--dragover', isDragging);
                },

                setLoadingState: (isLoading) => {
                    elements.dropArea.classList.toggle('upload-area--loading', isLoading);
                    elements.spinner.classList.toggle('upload-area__spinner--visible', isLoading);

                    if (isLoading) {
                        utils.showMessage('Processando seu currículo...');
                    } else {
                        utils.showMessage('');
                    }
                },

                isAllowedFile: (file) => {
                    const allowed = ['pdf','doc','docx'];
                    const name = (file.name || '').toLowerCase();
                    const ext = name.split('.').pop();
                    return allowed.includes(ext);
                }
            };

            // Real upload logic
            const upload = {
                startUpload: async (file) => {
                    try {
                        const formData = new FormData();
                        formData.append('file', file);

                        const response = await fetch(CONFIG.uploadUrl, {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            let errText = 'Falha no envio. Por favor, tente novamente.';
                            try {
                                const data = await response.json();
                                if (data && (data.message || data.error)) {
                                    errText = data.message || data.error;
                                }
                            } catch (_) {}
                            return utils.onUploadError(errText);
                        }

                        const json = await response.json();
                        if (!json || !json.file_id) {
                            return utils.onUploadError('Envio bem-sucedido, mas o file_id está ausente.');
                        }

                        utils.onUploadSuccess(json.file_id);
                    } catch (e) {
                        utils.onUploadError('Erro de rede durante o envio.');
                    }
                }
            };

            // Success / error handlers (moved into utils namespace to reuse)
            utils.onUploadSuccess = (fileId) => {
                isProcessing = false;
                utils.setLoadingState(false); // return UI to initial state (hide spinner)
                // Redirect immediately after UI reset
                window.location.assign(CONFIG.redirectBase + encodeURIComponent(fileId));
            };

            utils.onUploadError = (message) => {
                isProcessing = false;
                utils.showMessage(message || 'Falha no envio. Por favor, tente novamente.', true);
                utils.setLoadingState(false);
            };

            // Event handlers
            const handlers = {
                beginUploadFlow: (file) => {
                    if (!file) return;
                    if (!utils.isAllowedFile(file)) {
                        utils.showMessage('Formatos permitidos: pdf, docx, doc', true);
                        return;
                    }
                    if (isProcessing) return;
                    isProcessing = true;
                    utils.showMessage(`Enviando ${file.name}...`);
                    utils.setLoadingState(true); // show spinner while waiting for API
                    upload.startUpload(file);
                },

                handleFileChange: (event) => {
                    const file = event.target.files[0];
                    handlers.beginUploadFlow(file);
                },

                handleDragEnter: (event) => { event.preventDefault(); utils.updateDragState(true); },
                handleDragOver: (event) => { event.preventDefault(); utils.updateDragState(true); },
                handleDragLeave: (event) => { event.preventDefault(); if (!event.relatedTarget || !elements.dropArea.contains(event.relatedTarget)) { utils.updateDragState(false); } },

                handleDrop: (event) => {
                    event.preventDefault();
                    utils.updateDragState(false);

                    const files = event.dataTransfer.files;
                    handlers.beginUploadFlow(files && files[0]);
                },

                handleKeyDown: (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        elements.fileInput.click();
                    }
                },

                handleClick: () => { /* no-op */ }
            };

            // Initialize the component
            const init = () => {
                elements.dropArea.addEventListener('keydown', handlers.handleKeyDown);
                elements.dropArea.addEventListener('click', handlers.handleClick);
                elements.fileInput.addEventListener('change', handlers.handleFileChange);

                ['dragenter', 'dragover'].forEach(eventName => {
                    elements.dropArea.addEventListener(eventName, handlers.handleDragEnter);
                });
                ['dragleave', 'drop'].forEach(eventName => {
                    elements.dropArea.addEventListener(eventName, handlers.handleDragLeave);
                });
                elements.dropArea.addEventListener('drop', handlers.handleDrop);

                return () => {
                    elements.dropArea.removeEventListener('keydown', handlers.handleKeyDown);
                    elements.dropArea.removeEventListener('click', handlers.handleClick);
                    elements.fileInput.removeEventListener('change', handlers.handleFileChange);
                    ['dragenter', 'dragover'].forEach(eventName => {
                        elements.dropArea.removeEventListener(eventName, handlers.handleDragEnter);
                    });
                    ['dragleave', 'drop'].forEach(eventName => {
                        elements.dropArea.removeEventListener(eventName, handlers.handleDragLeave);
                    });
                    elements.dropArea.removeEventListener('drop', handlers.handleDrop);
                };
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // Expose minimal public API
            window.ResumeUpload = {
                setLoadingState: utils.setLoadingState
            };
        })();
    </script>
</body>
</html>
