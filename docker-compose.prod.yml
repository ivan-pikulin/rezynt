name: rezynt

x-common-variables: &common-variables
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CELERY_DB: 1

x-backend-variables: &backend-variables
  <<: *common-variables
  APP_API_KEY: ${APP_API_KEY}
  SECRET_KEY: ${SECRET_KEY}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_USERNAME: ${EMAIL_USERNAME}
  EMAIL_PASSWORD: ${EMAIL_PASSWORD}
  EMAIL_DOMAIN: ${EMAIL_DOMAIN:-rezynt.com}
  EMAIL_DKIM_PRIVATE_KEY_PATH: /app/dkim-key.private
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
  API_BASE_URL: ${API_BASE_URL}
  PLATFORM_SCRATCH_APP_KEY: ${PLATFORM_SCRATCH_APP_KEY}
  PLATFORM_UPLOAD_APP_KEY: ${PLATFORM_UPLOAD_APP_KEY}
  PLATFORM_APP_URL: ${PLATFORM_APP_URL}
  AUTO_GENERATE_MIGRATIONS: ${AUTO_GENERATE_MIGRATIONS:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_PROXY_URL: ${OPENAI_PROXY_URL}
  GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}

services:
  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/ivan-pikulin}/rezynt-frontend:${IMAGE_TAG:-main}
    pull_policy: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      public:
        aliases:
          - rezynt-frontend
      app-network:

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/ivan-pikulin}/rezynt-backend:${IMAGE_TAG:-main}
    pull_policy: always
    expose:
      - "8000"
    environment:
      <<: *backend-variables
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -ec "mkdir -p /app/app/database/migrations/versions;
      cp -n /app/app/database/migrations_baked/versions/*.py /app/app/database/migrations/versions/ 2>/dev/null || true;
      /app/app/scripts/migrate.sh &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info"
    volumes:
      - ${EMAIL_DKIM_PRIVATE_KEY_PATH}:/app/dkim-key.private:ro
      - migrations_data:/app/app/database/migrations/versions
      - temp_uploads_data:/app/temp_uploads
    restart: unless-stopped
    networks:
      public:
        aliases:
          - rezynt-backend
      app-network:
      backend-network:

  celery:
    image: ${IMAGE_PREFIX:-ghcr.io/ivan-pikulin}/rezynt-backend:${IMAGE_TAG:-main}
    pull_policy: always
    environment:
      <<: *backend-variables
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "true"
      CELERY_BROKER_CONNECTION_MAX_RETRIES: "10"
      CELERY_BROKER_CONNECTION_RETRY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run celery -A app.core.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-memory-per-child=500000
    volumes:
      - ${EMAIL_DKIM_PRIVATE_KEY_PATH}:/app/dkim-key.private:ro
      - temp_uploads_data:/app/temp_uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - backend-network

  postgres:
    image: postgres:15-alpine
    environment:
      <<: *common-variables
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1000 --stop-writes-on-bgsave-error no --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend-network

volumes:
  postgres_data:
  redis_data:
  migrations_data:
  temp_uploads_data:

networks:
  public:
    external: true
    name: sara-help_default
  app-network:
    driver: bridge
  backend-network:
    driver: bridge
