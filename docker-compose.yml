x-common-variables: &common-variables
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CELERY_DB: 1

x-backend-variables: &backend-variables
  <<: *common-variables
  APP_API_KEY: ${APP_API_KEY}
  SECRET_KEY: ${SECRET_KEY}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
  YOOKASSA_WEBHOOK_SECRET: ${YOOKASSA_WEBHOOK_SECRET}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES}
  RESEND_API_KEY: ${RESEND_API_KEY}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
  API_BASE_URL: ${API_BASE_URL}
  PLATFORM_SCRATCH_APP_KEY: ${PLATFORM_SCRATCH_APP_KEY}
  PLATFORM_UPLOAD_APP_KEY: ${PLATFORM_UPLOAD_APP_KEY}
  PLATFORM_APP_URL: ${PLATFORM_APP_URL}
  AUTO_GENERATE_MIGRATIONS: ${AUTO_GENERATE_MIGRATIONS:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_PROXY_URL: ${OPENAI_PROXY_URL}

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
      - backend-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_BASE_URL}
        VITE_YANDEX_METRIKA_COUNTER_ID: ${VITE_YANDEX_METRIKA_COUNTER_ID}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    expose:
      - "80"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${API_BASE_URL}
      VITE_YANDEX_METRIKA_COUNTER_ID: ${VITE_YANDEX_METRIKA_COUNTER_ID}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      <<: *backend-variables
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: |
      sh -c "
        chmod +x /app/app/scripts/migrate.sh
        /app/app/scripts/migrate.sh
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
      "
    volumes:
      - migrations_data:/app/app/database/migrations
      - temp_uploads_data:/app/temp_uploads
    networks:
      - app-network
      - backend-network

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-variables
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "true"
      CELERY_BROKER_CONNECTION_MAX_RETRIES: "10"
      CELERY_BROKER_CONNECTION_RETRY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run celery -A app.core.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-memory-per-child=500000
    volumes:
      - migrations_data:/app/app/database/migrations
      - temp_uploads_data:/app/temp_uploads
    networks:
      - app-network
      - backend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      <<: *common-variables
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
      - backend-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1000 --stop-writes-on-bgsave-error no --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
      - backend-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --non-interactive --quiet; sleep 12h & wait $!; done"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  migrations_data:
  temp_uploads_data:
  letsencrypt:
  certbot-www:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge 
  backend-network:
    driver: bridge 
