x-common-variables: &common-variables
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/rezynt.com/fullchain.pem:/etc/nginx/ssl/rezynt.com/fullchain.pem:ro
      - /etc/letsencrypt/live/rezynt.com/privkey.pem:/etc/nginx/ssl/rezynt.com/privkey.pem:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
      - backend-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    expose:
      - "80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      <<: *common-variables
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    user: "0"
    command: |
      sh -c "
        if [ ! -e /opt/migrations/versions ]; then
          mkdir -p /opt/migrations/versions;
        fi
        cp -r /opt/migrations/versions/ /app/app/database/migrations/
        chmod +x /app/app/scripts/run_migrations.sh
        /app/app/scripts/run_migrations.sh
        cp -rT /app/app/database/migrations/versions/ /opt/migrations/versions/
        su appuser -c 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug'
      "
    networks:
      - app-network
      - backend-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      <<: *common-variables
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
      - backend-network
    
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      <<: *common-variables
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    networks:
      - backend-network


  minio-init:
    image: minio/mc
    depends_on:
    minio:
        condition: service_healthy
    env_file:
      .env.rezynt
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO to be ready...';
        for i in {1..30}; do
        if mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} > /dev/null 2>&1; then
            echo 'MinIO is ready!';
            break;
          fi
          echo 'Waiting for MinIO... (attempt $i/30)';
          sleep 5;
        done;
        mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME} &&
        mc anonymous set download myminio/${MINIO_BUCKET_NAME} &&
        echo 'MinIO initialization completed successfully!'
      "
    restart: on-failure
    networks:
      - backend-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge 
  backend-network:
    driver: bridge 