x-common-variables: &common-variables
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0

x-backend-variables: &backend-variables
  <<: *common-variables
  APP_API_KEY: ${APP_API_KEY}
  SECRET_KEY: ${SECRET_KEY}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES}
  EMAIL_HOST: smtp.timeweb.ru
  EMAIL_PORT: 465
  EMAIL_USERNAME: team@rezynt.com
  EMAIL_PASSWORD: ${EMAIL_PASSWORD}
  EMAIL_DKIM_PRIVATE_KEY_PATH: /app/dkim-key.private
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
  API_BASE_URL: ${API_BASE_URL}
  PLATFORM_SCRATCH_APP_KEY: ${PLATFORM_SCRATCH_APP_KEY}
  PLATFORM_UPLOAD_APP_KEY: ${PLATFORM_UPLOAD_APP_KEY}
  PLATFORM_APP_URL: ${PLATFORM_APP_URL}

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_BASE_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${API_BASE_URL}
    depends_on:
      - backend
    networks:
      - app-network
    ports:
      - "80:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      <<: *backend-variables
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: |
      sh -c "
        chmod +x /app/app/scripts/migrate.sh
        /app/app/scripts/migrate.sh
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
      "
    networks:
      - app-network
      - backend-network
    ports:
      - "8001:8000"

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      <<: *common-variables
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
      - backend-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
      - backend-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge 
  backend-network:
    driver: bridge
