x-common-variables: &common-variables
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CELERY_DB: 1

x-backend-variables: &backend-variables
  <<: *common-variables
  APP_API_KEY: ${APP_API_KEY}
  SECRET_KEY: ${SECRET_KEY}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES}
  EMAIL_HOST: smtp.timeweb.ru
  EMAIL_PORT: 465
  EMAIL_USERNAME: team@rezynt.com
  EMAIL_PASSWORD: ${EMAIL_PASSWORD}
  EMAIL_DKIM_PRIVATE_KEY_PATH: /app/dkim-key.private
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
  API_BASE_URL: ${API_BASE_URL}
  PLATFORM_SCRATCH_APP_KEY: ${PLATFORM_SCRATCH_APP_KEY}
  PLATFORM_UPLOAD_APP_KEY: ${PLATFORM_UPLOAD_APP_KEY}
  PLATFORM_APP_URL: ${PLATFORM_APP_URL}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_PROXY_URL: ${OPENAI_PROXY_URL}

services:
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     args:
  #       VITE_API_URL: ${API_BASE_URL}
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   environment:
  #     VITE_API_URL: ${API_BASE_URL}
  #   depends_on:
  #     - backend
  #   networks:
  #     - app-network
  #   ports:
  #     - "80:80"

  backend:
    image: rezynt-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      <<: *backend-variables
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: |
      sh -c "
        sh /app/app/scripts/migrate.sh
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
      "
    networks:
      - app-network
      - backend-network
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - ./backend/app:/app/app
      - temp_uploads_data:/app/temp_uploads

  celery:
    image: rezynt-backend:local
    environment:
      <<: *backend-variables
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "true"
      CELERY_BROKER_CONNECTION_MAX_RETRIES: "10"
      CELERY_BROKER_CONNECTION_RETRY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run celery -A app.core.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-memory-per-child=500000
    volumes:
      - ./backend/app:/app/app
      - temp_uploads_data:/app/temp_uploads
    networks:
      - app-network
      - backend-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      <<: *common-variables
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
      - backend-network

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
      - backend-network


volumes:
  postgres_data:
  redis_data:
  temp_uploads_data:

networks:
  app-network:
    driver: bridge 
  backend-network:
    driver: bridge
