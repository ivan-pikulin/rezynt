server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm index (1).html;

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Canonical entry points
    location = / {
        try_files /index%20(1).html =404;
    }

    location = /privacy-policy {
        return 301 /privacy-policy/;
    }

    location = /terms-of-service {
        return 301 /terms-of-service/;
    }

    location = /privacy-policy/ {
        try_files /privacy-policy%20(1).html =404;
    }

    location = /terms-of-service/ {
        try_files /terms-of-service%20(1).html =404;
    }

    # Static assets from exported folder
    location ^~ /static/ {
        alias /usr/share/nginx/html/exported_website/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Handle nested routes referencing "static/*" (e.g. /privacy-policy/static/*)
    location ~ ^/(?:[^/]+)/static/(.*)$ {
        alias /usr/share/nginx/html/exported_website/static/$1;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Allow direct access to exported assets if needed
    location ^~ /exported_website/ {
        alias /usr/share/nginx/html/exported_website/;
        expires 1h;
    }

    # Default file serving
    location / {
        try_files $uri $uri/ =404;
    }
}


