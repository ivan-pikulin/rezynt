name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increase if needed for long builds/migrations
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 3600s  # 1 hour, increase if needed
          script: |
            set -e

            # Navigate to project directory
            cd /root/family-tree
            
            # Backup current .env if exists
            if [ -f .env ]; then
              cp .env .env.backup
            fi
            
            # Create new .env from GitHub variable
            echo "${{ vars.PROD_ENV }}" > .env
            
            # Pull latest changes
            git pull origin main
            
            # Build new images in the background (does not stop running containers)
            docker compose -f docker-compose.yml build
            
            # Start new containers with zero-downtime (recreate only changed)
            docker compose --env-file .env up -d --remove-orphans
            
            # Wait for backend to be healthy (replace with your health endpoint if different)
            for i in {1..30}; do
              if curl -fs http://localhost:8000/health; then
                echo "Backend is healthy!"
                break
              fi
              echo "Waiting for backend to be healthy..."
              sleep 5
            done
            
            # Cleanup old images
            docker image prune -f
