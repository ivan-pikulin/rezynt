name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increase if needed for long builds/migrations
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 3600s  # 1 hour, increase if needed
          script: |
            set -e

            echo "Starting deployment to production..."

            # Navigate to project directory
            cd /root/rezynt
            
            # Backup current .env if exists
            if [ -f .env ]; then
              cp .env .env.backup
            fi
            
            # Create new .env from GitHub variable
            echo "${{ vars.PROD_ENV }}" > .env
            
            # Pull latest changes
            echo "Pulling latest changes from git..."
            git pull origin main
            
            # Stop all containers before building
            echo "Stopping all containers..."
            docker compose down
            
            # Build new images
            echo "Building Docker images..."
            docker compose -f docker-compose.yml build
            
            # Start new containers with zero-downtime (recreate only changed)
            echo "Starting containers..."
            docker compose --env-file .env up -d --remove-orphans
            
            # Restart nginx container to ensure it picks up any configuration changes
            echo "Restarting nginx container..."
            docker compose --env-file .env restart nginx
            
            # Cleanup old images
            echo "Cleaning up old Docker images..."
            docker image prune -f
            
            echo "Deployment completed successfully!"
