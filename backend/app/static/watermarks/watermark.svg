<?xml version="1.0" encoding="UTF-8"?>
<svg width="210mm" height="297mm" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
  <!-- A4 size watermark overlay -->
  <defs>
    <!-- Large diagonal watermark text -->
    <text id="watermark-text" 
          x="105" y="148.5" 
          font-family="Arial, sans-serif" 
          font-size="48" 
          font-weight="bold"
          fill="rgba(0,0,0,0.15)" 
          text-anchor="middle" 
          dominant-baseline="middle"
          transform="rotate(-45 105 148.5)">
      REZYNT
    </text>
    
    <!-- Smaller watermark in corners -->
    <text id="corner-watermark" 
          font-family="Arial, sans-serif" 
          font-size="16" 
          font-weight="bold"
          fill="rgba(0,0,0,0.1)" 
          text-anchor="middle" 
          dominant-baseline="middle">
      REZYNT
    </text>
  </defs>
  
  <!-- Main diagonal watermark -->
  <use href="#watermark-text"/>
  
  <!-- Corner watermarks -->
  <use href="#corner-watermark" x="30" y="30" transform="rotate(-45 30 30)"/>
  <use href="#corner-watermark" x="180" y="30" transform="rotate(-45 180 30)"/>
  <use href="#corner-watermark" x="30" y="267" transform="rotate(-45 30 267)"/>
  <use href="#corner-watermark" x="180" y="267" transform="rotate(-45 180 267)"/>
</svg>
